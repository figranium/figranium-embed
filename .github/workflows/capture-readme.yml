name: Capture README Screenshot

on:
  push:
    branches: [readme-screenshot]

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Build zero-host embed
        run: npm run build

      - name: Fetch Google Maps Leads Scraper from Templates Hub
        run: |
          curl --fail --silent --show-error \
            'https://templates.figranium.dev/api/presets/41da9f7c-0a49-490f-aca8-f287519cca87' \
            -o /tmp/maps-preset.json

      - name: Serve built package
        run: |
          python3 -m http.server 4173 > /tmp/embed-http.log 2>&1 &
          echo $! > /tmp/embed-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/embed-http.log
          exit 1

      - name: Verify and capture real iframe
        env:
          PRESET_FILE: /tmp/maps-preset.json
        run: node tests/capture-readme.mjs

      - name: Commit screenshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f assets/google-maps-leads-scraper.png
          git commit -m 'docs: add Google Maps embed screenshot'
          git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: figranium-embed-readme-screenshot
          path: |
            assets/google-maps-leads-scraper.png
            /tmp/maps-preset.json
            /tmp/embed-http.log
          if-no-files-found: warn
