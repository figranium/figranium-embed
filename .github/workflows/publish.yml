name: Publish npm

on:
  push:
    branches: [main]
    paths:
      - package.json
      - src/**
      - scripts/**
      - iframe.internal.html
      - vite*.ts
      - .github/workflows/publish.yml

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install
      - name: Build
        run: npm run build
      - name: Publish unpublished version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@figranium/embed@$VERSION" version >/dev/null 2>&1; then
            echo "@figranium/embed@$VERSION is already published; skipping."
            exit 0
          fi
          npm publish --access public
