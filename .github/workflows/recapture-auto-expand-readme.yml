name: Recapture Auto Expand README Screenshot
on:
  push:
    branches: [recapture-auto-expand-stickies]
permissions:
  contents: write
jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: npm run build
      - run: curl --fail --silent --show-error 'https://templates.figranium.dev/api/presets/41da9f7c-0a49-490f-aca8-f287519cca87' -o /tmp/maps-preset.json
      - run: python3 -m http.server 4173 >/tmp/http.log 2>&1 &
      - run: sleep 2 && PRESET_FILE=/tmp/maps-preset.json node tests/capture-auto-expand-readme.mjs
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f assets/google-maps-leads-scraper.png
          git commit -m 'docs: recapture auto-expanded sticky note'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: auto-expand-sticky-screenshot
          path: assets/google-maps-leads-scraper.png
